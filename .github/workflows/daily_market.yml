# 미국 마감시황 자동 전송 워크플로우
#
# 데이터 소스:
#   - Yahoo Finance API: 실시간 지수/환율/원자재 데이터
#   - 텔레그램 채널(@shmstory): 시황 분석 메시지
#
# 실행 시간 (한국시간 기준, 월-금):
#   - 1차: 06:30 (UTC 21:30)
#   - 2차: 06:40 (UTC 21:40) - 1차 실패 시
#   - 3차: 06:50 (UTC 21:50) - 2차 실패 시
#
# 필요한 Secrets:
#   - DEEPSEEK_API_KEY: DeepSeek API 키 (메인)
#   - TELEGRAM_BOT_TOKEN: 텔레그램 봇 토큰

name: 미국 마감시황 자동 전송

on:
  # 수동 실행
  workflow_dispatch:
    inputs:
      use_detailed:
        description: '상세 요약 사용'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  # 스케줄 실행 (한국시간 06:30, 06:40, 06:50 = UTC 21:30, 21:40, 21:50)
  schedule:
    - cron: '30 21 * * 1-5'  # 한국시간 06:30
    - cron: '40 21 * * 1-5'  # 한국시간 06:40
    - cron: '50 21 * * 1-5'  # 한국시간 06:50

jobs:
  send-market-summary:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: config.py 생성
        run: |
          cat > config.py << 'EOF'
          # 자동 생성된 설정 파일
          import os

          # LLM 설정
          LLM_PROVIDER = "deepseek"
          LLM_FALLBACK = "openrouter"
          DEEPSEEK_API_KEY = os.environ.get('DEEPSEEK_API_KEY', '')
          OPENROUTER_API_KEY = os.environ.get('OPENROUTER_API_KEY', '')
          OPENROUTER_MODEL = "mistralai/mistral-small"
          GEMINI_API_KEY = os.environ.get('GEMINI_API_KEY', '')
          GEMINI_MODEL = 'gemini-pro'

          # 텔레그램 설정
          TELEGRAM_BOT_TOKEN = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          TELEGRAM_SEND_TO_CHAT_ID = os.environ.get('TELEGRAM_SEND_TO_CHAT_ID', '')
          TELEGRAM_CHANNEL_USERNAME = os.environ.get('TELEGRAM_CHANNEL_USERNAME', '')
          BRIEFING_MARKET_WRAP_URL = os.environ.get('BRIEFING_MARKET_WRAP_URL', '')
          USE_DETAILED_FORMAT = os.environ.get('USE_DETAILED_FORMAT', 'false').lower() == 'true'
          LOG_LEVEL = 'INFO'

          # CHAT_ID를 정수로 변환
          if TELEGRAM_SEND_TO_CHAT_ID:
              try:
                  TELEGRAM_SEND_TO_CHAT_ID = int(TELEGRAM_SEND_TO_CHAT_ID)
              except ValueError:
                  pass
          EOF

      - name: 설정 검증
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "설정 검증 중..."

          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "❌ DEEPSEEK_API_KEY가 설정되지 않았습니다"
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN이 설정되지 않았습니다"
            exit 1
          fi

          echo "✅ 필수 설정 확인 완료"

      - name: 마감시황 전송 실행
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SEND_TO_CHAT_ID: "-1002524208934"
          TELEGRAM_CHANNEL_USERNAME: "shmstory"
          BRIEFING_MARKET_WRAP_URL: ""
          USE_DETAILED_FORMAT: ${{ github.event.inputs.use_detailed || 'false' }}
        run: |
          echo "📈 미국 마감시황 전송 시작"
          echo "현재 시간 (UTC): $(date -u)"
          echo "현재 시간 (KST): $(TZ='Asia/Seoul' date)"
          echo ""
          python main_market.py

      - name: 로그 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            market_summary.log
            output/
          retention-days: 7

      - name: 실행 결과 요약
        if: always()
        run: |
          echo "========================================"
          echo "실행 결과"
          echo "========================================"
          if [ -f "market_summary.log" ]; then
            echo "최근 로그:"
            tail -20 market_summary.log
          fi
          echo "========================================"
